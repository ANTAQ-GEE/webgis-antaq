<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Corporativo | ANTAQ</title>

  <!-- Biblioteca Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Reset básico e ocupação total da tela */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html, #mapa {
      width: 100%;
      height: 100%;
      background-color: #0b132b;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
    }

    /* ========================================================
       1. ESTILIZAÇÃO CARTOGRÁFICA DOS RÓTULOS (TEXT LABELS)
       ======================================================== */
    
    /* Rótulo dos Estados (UF): Maiúsculo, espaçado e com halo escuro profundo */
    .rotulo-uf {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      pointer-events: none !important;
      /* Halo cartográfico de 4 direções para contraste absoluto sobre imagem orbital */
      text-shadow:
        -1px -1px 2px #020617,
         1px -1px 2px #020617,
        -1px  1px 2px #020617,
         1px  1px 2px #020617,
         0px  0px 5px #000000;
    }

    /* Rótulo dos Municípios (preparado para escala aproximada) */
    .rotulo-municipio {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      pointer-events: none !important;
      text-shadow:
        -1px -1px 2px #0f172a,
         1px -1px 2px #0f172a,
        -1px  1px 2px #0f172a,
         1px  1px 2px #0f172a;
    }

    /* Remove a seta padrão do Tooltip do Leaflet para ficar limpo */
    .leaflet-tooltip-top:before,
    .leaflet-tooltip-bottom:before,
    .leaflet-tooltip-left:before,
    .leaflet-tooltip-right:before {
      display: none !important;
    }

    /* ========================================================
       2. DESIGN DO POPUP PROFISSIONAL (PADRÃO EXECUTIVO ANTAQ)
       ======================================================== */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4;
      min-width: 260px;
    }

    /* Cabeçalho do Popup */
    .popup-header {
      background: linear-gradient(135deg, #0a2540 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #38bdf8;
    }

    .popup-badge {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-weight: 600;
    }

    /* Corpo de informações do Popup */
    .popup-body {
      padding: 12px 14px;
      font-size: 12px;
      color: #334155;
    }

    .popup-linha {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .popup-linha:last-child {
      border-bottom: none;
    }

    .popup-rotulo {
      font-weight: 600;
      color: #64748b;
    }

    .popup-valor {
      font-weight: 600;
      color: #0f172a;
      text-align: right;
    }

    .popup-footer {
      background: #f8fafc;
      padding: 8px 14px;
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #e2e8f0;
    }

    /* Painel do Título Superior */
    .map-brand-header {
      position: absolute;
      top: 16px;
      left: 60px;
      z-index: 1000;
      background: rgba(10, 37, 64, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      pointer-events: auto;
    }
    .map-brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .map-brand-sub {
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Institucional Superior -->
  <div class="map-brand-header">
    <div class="map-brand-title">SISTEMA WEBGIS | INFRAESTRUTURA AQUAVIÁRIA</div>
    <div class="map-brand-sub">Agência Nacional de Transportes Aquaviários - ANTAQ</div>
  </div>

  <!-- Contêiner do Mapa -->
  <div id="mapa"></div>

  <!-- Biblioteca Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ========================================================
    // 1. INICIALIZAÇÃO DO MAPA
    // ========================================================
    // Coordenadas iniciais centralizadas no Brasil, com visão geral
    const mapa = L.map('mapa', {
      center: [-13.5, -51.5],
      zoom: 4,
      minZoom: 3,
      maxZoom: 18,
      zoomControl: true
    });

    // Reposiciona o controle de zoom para o canto superior direito
    mapa.zoomControl.setPosition('topright');

    // ========================================================
    // 2. CAMADAS BASE (SATÉLITE + LABELS HÍBRIDOS PROFISSIONAIS)
    // ========================================================
    
    // Imagem de Satélite pura (Esri World Imagery)
    const sateliteEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Imagens Orbitais',
      maxZoom: 18
    }).addTo(mapa);

    // Camada transparente de Rótulos de Cidades/Capitais/Divisas (Esri Reference)
    // Isso garante que todas as cidades apareçam sem precisar carregar arquivos pesados de municípios
    const rotulosReferencia = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Nomes de Referência &copy; Esri',
      pane: 'overlayPane' // Fica por cima do satélite
    }).addTo(mapa);

    // Mapa base alternativo (CartoDB Dark para análise técnica noturna)
    const basemapEscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CartoDB &copy; OpenStreetMap contributors'
    });

    // ========================================================
    // 3. GERENCIADOR DE CAMADAS ANTI-DUPLICAÇÃO (CamadaManager)
    // ========================================================
    // Mantém uma única instância de cada camada em memória.
    // Ao atualizar, ele limpa e substitui sem criar duplicatas no mapa ou na legenda.
    const CamadaManager = {
      camadas: {},

      /**
       * Carrega ou Atualiza uma camada GeoJSON
       * @param {string} id - Identificador imutável da camada (ex: 'uf', 'portos')
       * @param {string} url - Caminho do arquivo padronizado (ex: 'dados/uf.geojson')
       * @param {Object} opcoes - Funções de estilo e eventos do Leaflet
       */
      carregar: function(id, url, opcoes = {}) {
        // Evita cache do navegador anexando timestamp na requisição
        const urlAntiCache = `${url}?_t=${new Date().getTime()}`;

        fetch(urlAntiCache)
          .then(resposta => {
            if (!resposta.ok) {
              throw new Error(`HTTP ${resposta.status} ao carregar ${url}`);
            }
            return resposta.json();
          })
          .then(geojsonData => {
            // Se a camada já existe no mapa, substitui os dados sem recriar objeto
            if (this.camadas[id]) {
              this.camadas[id].clearLayers();
              this.camadas[id].addData(geojsonData);
              console.log(`[ATUALIZADO] Camada '${id}' substituída com sucesso.`);
            } else {
              // Se é a primeira vez, instancia e adiciona ao mapa
              this.camadas[id] = L.geoJSON(geojsonData, opcoes).addTo(mapa);
              
              // Adiciona ao menu de controle de camadas
              controleCamadas.addOverlay(this.camadas[id], opcoes.nomeLegenda || id);
              console.log(`[CARREGADO] Camada '${id}' registrada.`);
            }
          })
          .catch(erro => {
            console.warn(`[AVISO] Não foi possível carregar a camada '${id}': ${erro.message}`);
          });
      }
    };

    // Controle lateral de camadas do Leaflet
    const baseLayers = {
      "Imagem de Satélite": sateliteEsri,
      "Mapa Técnico Escuro": basemapEscuro
    };
    const overlayLayers = {
      "Nomes de Cidades / Referências": rotulosReferencia
    };
    const controleCamadas = L.control.layers(baseLayers, overlayLayers, {
      collapsed: false,
      position: 'topright'
    }).addTo(mapa);

    // ========================================================
    // 4. ESTILOS E CARREGAMENTO DAS CAMADAS DO WEBGIS
    // ========================================================

    // --- A. ESTADOS (UF) ---
    CamadaManager.carregar('uf', 'dados/uf.geojson', {
      nomeLegenda: "Limites Estaduais (UF)",
      style: {
        color: '#60a5fa',         // Contorno sutil em azul claro
        weight: 1.2,
        opacity: 0.8,
        fillOpacity: 0.0          // Transparente para valorizar o satélite
      },
      onEachFeature: function(feature, layer) {
        // Extrai a sigla da UF com resiliência a variações de campos
        const p = feature.properties || {};
        const siglaUf = p.SIGLA_UF || p.sigla || p.UF || p.nome || p.NM_UF;

        if (siglaUf) {
          layer.bindTooltip(siglaUf, {
            permanent: true,       // Texto fixo
            direction: 'center',   // Centralizado no polígono da UF
            className: 'rotulo-uf' // Classe com o Halo escuro
          });
        }
      }
    });

    // --- B. INSTALAÇÕES PORTUÁRIAS (POPUP PROFISSIONAL) ---
    CamadaManager.carregar('portos', 'dados/instalacoes_portuarias.geojson', {
      nomeLegenda: "Instalações Portuárias",
      pointToLayer: function(feature, latlng) {
        // Marcador circular náutico profissional com borda branca destacada
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: '#10b981',   // Verde esmeralda para terminais autorizados
          color: '#ffffff',       // Borda branca para contraste
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        });
      },
      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        
        // Identificação do Terminal
        const nomeInstalacao = p.nome || p.NOME_INSTALACAO || p.NOME || 'Terminal Aquaviário';
        const tipoInstalacao = p.tipo || p.TIPO_INSTALACAO || p.tipo_instalacao || 'Instalação Portuária';
        const municipio = p.municipio || p.MUNICIPIO || p.cidade || '-';
        const uf = p.uf || p.UF || p.sigla_uf || '-';
        const perfilCarga = p.perfil_carga || p.PERFIL_CARGA || p.carga || 'Diversos';

        // Template do Popup Executivo (substitui 'Custódia ANTAQ')
        const htmlPopup = `
          <div class="popup-header">
            <span>${nomeInstalacao}</span>
            <span class="popup-badge">OUTORGA</span>
          </div>
          <div class="popup-body">
            <div class="popup-linha">
              <span class="popup-rotulo">Tipo:</span>
              <span class="popup-valor">${tipoInstalacao}</span>
            </div>
            <div class="popup-linha">
              <span class="popup-rotulo">Localização:</span>
              <span class="popup-valor">${municipio} / ${uf}</span>
            </div>
            <div class="popup-linha">
              <span class="popup-rotulo">Perfil de Carga:</span>
              <span class="popup-valor">${perfilCarga}</span>
            </div>
          </div>
          <div class="popup-footer">
            <span>Regulação: <b>ANTAQ</b></span>
            <span>Ambiente: <b>Produção</b></span>
          </div>
        `;

        layer.bindPopup(htmlPopup);
      }
    });

    // --- C. VIAS ECONOMICAMENTE NAVEGADAS ---
    CamadaManager.carregar('vias_navegadas', 'dados/vias_economicamente_navegadas.geojson', {
      nomeLegenda: "Vias Navegadas",
      style: {
        color: '#00e5ff',         // Ciano fluorescente (ótima leitura sobre rios em satélite)
        weight: 2.5,
        opacity: 0.85
      },
      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        const rio = p.rio || p.NOME_RIO || p.nome || 'Trecho Hidroviário';
        layer.bindTooltip(`Rio: ${rio}`, { sticky: true });
      }
    });

    // --- D. LINHAS DE TRAVESSIAS ---
    CamadaManager.carregar('linhas_travessias', 'dados/linhas_travessias.geojson', {
      nomeLegenda: "Linhas de Travessias",
      style: {
        color: '#f59e0b',         // Âmbar
        weight: 2,
        dashArray: '5, 5',        // Tracejado náutico
        opacity: 0.9
      }
    });

    // --- E. POLIGONAIS (TIS) ---
    CamadaManager.carregar('tis_poligonais', 'dados/tis_poligonais.geojson', {
      nomeLegenda: "Poligonais Portuárias / TIS",
      style: {
        color: '#ef4444',         // Vermelho carmim
        weight: 1.5,
        fillColor: '#ef4444',
        fillOpacity: 0.25
      }
    });

    // ========================================================
    // 5. CONTROLE DINÂMICO DE ESCALA (SCALE-DEPENDENT ZOOM)
    // ========================================================
    // Alterna a visibilidade dos rótulos de Estado conforme o zoom
    // para não poluir o mapa quando o usuário der zoom em portos e municípios.
    mapa.on('zoomend', function() {
      const zoomAtual = mapa.getZoom();
      const camadaUf = CamadaManager.camadas['uf'];

      if (camadaUf) {
        // A partir do zoom 9 (visão de nível metropolitano/municipal), esconde o rótulo da UF
        if (zoomAtual >= 9 && mapa.hasLayer(camadaUf)) {
          mapa.removeLayer(camadaUf);
        } else if (zoomAtual < 9 && !mapa.hasLayer(camadaUf)) {
          mapa.addLayer(camadaUf);
        }
      }
    });

  </script>
</body>
</html>
