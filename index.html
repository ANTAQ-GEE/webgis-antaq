<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Corporativo | ANTAQ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
  <style>
    :root {
      --antaq-azul-escuro: #0a2540; --antaq-azul-claro: #0284c7; --gov-amarelo: #f59e0b;
      --gov-verde: #10b981; --gov-roxo: #8b5cf6; --gov-vermelho: #ef4444;
      --borda: #e2e8f0; --texto-escuro: #0f172a; --texto-claro: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html, #mapa { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: #0b132b; }
    .top-header { position: absolute; top: 0; left: 0; right: 0; height: 52px; background: var(--antaq-azul-escuro); border-bottom: 3px solid #0284c7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 2000; color: #fff; }
    .caixa-legenda { position: absolute; bottom: 24px; left: 16px; width: 250px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--borda); z-index: 1200; overflow: hidden; font-size: 11px; }
    .barra-filtros { position: absolute; top: 64px; left: 60px; z-index: 1500; background: rgba(10, 37, 64, 0.95); padding: 8px 12px; border-radius: 6px; display: flex; gap: 8px; color: #fff; }
    /* ... demais estilos mantidos conforme original ... */
  </style>
</head>
<body>
  <header class="top-header">
    <div class="brand-area"><div class="brand-title">ANTAQ - WEBGIS CORPORATIVO</div></div>
    <div class="actions-area">
      <button class="btn-graficos" onclick="UI.toggleGraficos()">📊 Gráficos</button>
      <button class="btn-homologacao" onclick="UI.toggleMenuAmbiente(event)"><span id="txt-ambiente">Homologação</span></button>
    </div>
  </header>
  <div class="barra-filtros">
    <select id="filtro-tipo" onchange="DataManager.filtrarCamada('instalacoes_portuarias', this.value)">
      <option value="TODOS">Mostrar Todos</option><option value="TUP">TUP</option><option value="PUBLICO">Porto Público</option><option value="IP4">IP4</option><option value="ETC">ETC</option>
    </select>
  </div>
  <div id="mapa" style="margin-top: 52px; height: calc(100% - 52px);"></div>
  <div class="caixa-legenda" id="legenda"><div class="legenda-topo">LEGENDA</div><div class="legenda-conteudo" id="corpo-legenda"></div></div>
  <script>
    const Security = {
      repararTexto: function(s) { if(!s) return ''; return s.replace(/Instala\uFFFD\uFFFDo/g, 'Instalação').replace(/P\uFFFDblico/g, 'Público').replace(/Amaz\uFFFDnica/g, 'Amazônica'); },
      ehValido: function(v) { if (v === null || v === undefined) return false; const s = String(v).trim().toLowerCase(); return !(s === '' || s === 'none' || s === 'nan' || s === 'null' || s === '-'); }
    };
    const CONFIG_CAMADAS = {
      instalacoes_portuarias: { nome: "Instalações Portuárias", cores: { TUP: '#10b981', PUBLICO: '#0284c7', IP4: '#f59e0b', ETC: '#8b5cf6', OUTROS: '#64748b' } },
      tis_poligonais: { nome: "Terras Indígenas", cor: "#ef4444" }
    };
    const mapa = L.map('mapa', { center: [-14, -52], zoom: 4, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(mapa);
    /* ... lógica de cores, popups limpos e módulos analíticos ... */
  </script>
</body>
</html>
          lbl.innerText = 'Homologação Ativa (Edição Livre)';
