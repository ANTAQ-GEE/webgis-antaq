<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Corporativo | ANTAQ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html, #mapa {
      width: 100%;
      height: 100%;
      background-color: #111827;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Rótulos dos Estados com Halo escuro */
    .rotulo-uf {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      letter-spacing: 1.5px !important;
      text-transform: uppercase !important;
      pointer-events: none !important;
      text-shadow:
        -1px -1px 2px #020617,
         1px -1px 2px #020617,
        -1px  1px 2px #020617,
         1px  1px 2px #020617,
         0px  0px 4px #000000;
    }

    /* Popups Profissionais */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .leaflet-popup-content { margin: 0 !important; min-width: 250px; }
    .popup-header {
      background: #0a2540;
      color: #fff;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13px;
      border-bottom: 2px solid #38bdf8;
    }
    .popup-body {
      padding: 12px 14px;
      font-size: 12px;
      color: #334155;
    }
    .popup-linha {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .popup-rotulo { font-weight: 600; color: #64748b; }
    .popup-valor { font-weight: 600; color: #0f172a; }
    .popup-footer {
      background: #f8fafc;
      padding: 6px 14px;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
    }

    /* Cabeçalho Institucional */
    .map-brand-header {
      position: absolute;
      top: 16px;
      left: 60px;
      z-index: 1000;
      background: rgba(10, 37, 64, 0.9);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .map-brand-title { font-size: 13px; font-weight: 700; }
    .map-brand-sub { font-size: 10px; color: #94a3b8; }

    /* Alerta na tela caso ocorra bloqueio de CORS (abertura com dois cliques) */
    #aviso-cors {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: #ef4444;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="map-brand-header">
    <div class="map-brand-title">SISTEMA WEBGIS | INFRAESTRUTURA AQUAVIÁRIA</div>
    <div class="map-brand-sub">Agência Nacional de Transportes Aquaviários - ANTAQ</div>
  </div>

  <div id="aviso-cors">
    ⚠️ O navegador bloqueou o carregamento das camadas porque o arquivo foi aberto com dois cliques (file://).<br>
    Abra pelo servidor local: <code>python -m http.server 8000</code> e acesse <code>http://localhost:8000</code>.
  </div>

  <div id="mapa"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Alerta imediato se o usuário abriu com duplo clique
    if (window.location.protocol === 'file:') {
      document.getElementById('aviso-cors').style.display = 'block';
    }

    // 2. Inicialização do Mapa
    const mapa = L.map('mapa', {
      center: [-13.5, -51.5],
      zoom: 4,
      zoomControl: true
    });
    mapa.zoomControl.setPosition('topright');

    // 3. Basemaps (Sem necessidade de Chaves/APIs)
    // Satélite Esri
    const sateliteEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Imagens Orbitais',
      maxZoom: 18
    }).addTo(mapa);

    // Rótulos transparentes sobrepostos ao satélite
    const rotulosReferencia = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Nomes de Referência &copy; Esri',
      pane: 'overlayPane'
    }).addTo(mapa);

    // MAPA TÉCNICO ESCURO (ESRI DARK GRAY CANVAS - 100% GRATUITO E SEM MARCA D'ÁGUA)
    const mapaEscuroEsri = L.layerGroup([
      L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Dark Canvas Base'
      }),
      L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Labels &copy; Esri'
      })
    ]);

    // 4. Controle de Camadas
    const baseLayers = {
      "Imagem de Satélite": sateliteEsri,
      "Mapa Técnico Escuro (Esri)": mapaEscuroEsri
    };
    const overlayLayers = {
      "Nomes de Cidades / Limites": rotulosReferencia
    };
    const controleCamadas = L.control.layers(baseLayers, overlayLayers, {
      collapsed: false,
      position: 'topright'
    }).addTo(mapa);

    // 5. Gerenciador de Camadas com Suporte a Fallback de Nomes
    const CamadaManager = {
      camadas: {},

      carregarComFallback: function(id, urls, opcoes = {}) {
        const grupo = L.geoJSON(null, opcoes).addTo(mapa);
        this.camadas[id] = grupo;
        controleCamadas.addOverlay(grupo, opcoes.nomeLegenda || id);

        // Função recursiva que tenta a lista de URLs (nome novo -> nome antigo)
        const tentarCarregar = (indice) => {
          if (indice >= urls.length) {
            console.warn(`[ERRO] Não foi possível encontrar nenhuma das fontes para a camada '${id}'.`);
            return;
          }

          const urlTentativa = `${urls[indice]}?_t=${new Date().getTime()}`;

          fetch(urlTentativa)
            .then(res => {
              if (!res.ok) throw new Error(`Status ${res.status}`);
              return res.json();
            })
            .then(data => {
              grupo.clearLayers();
              grupo.addData(data);
              console.log(`[OK] Camada '${id}' carregada com sucesso de: ${urls[indice]}`);
            })
            .catch(() => {
              // Se falhou (ex: 404), tenta o próximo nome da lista
              tentarCarregar(indice + 1);
            });
        };

        tentarCarregar(0);
      }
    };

    // 6. Carregamento com Fallback Inteligente (Tenta nome novo, se falhar tenta o original)

    // --- UFs (Estados) ---
    CamadaManager.carregarComFallback('uf', ['dados/uf.geojson', 'dados/UF.geojson'], {
      nomeLegenda: "Limites Estaduais (UF)",
      style: { color: '#60a5fa', weight: 1.2, fillOpacity: 0 },
      onEachFeature: (f, layer) => {
        const p = f.properties || {};
        const nome = p.SIGLA_UF || p.sigla || p.UF || p.nome || p.NM_UF;
        if (nome) {
          layer.bindTooltip(nome, { permanent: true, direction: 'center', className: 'rotulo-uf' });
        }
      }
    });

    // --- Instalações Portuárias ---
    CamadaManager.carregarComFallback('portos', ['dados/instalacoes_portuarias.geojson'], {
      nomeLegenda: "Instalações Portuárias",
      pointToLayer: (f, latlng) => L.circleMarker(latlng, {
        radius: 6,
        fillColor: '#10b981',
        color: '#ffffff',
        weight: 1.5,
        fillOpacity: 0.9
      }),
      onEachFeature: (f, layer) => {
        const p = f.properties || {};
        const nome = p.nome || p.NOME_INSTALACAO || p.NOME || 'Terminal Aquaviário';
        const tipo = p.tipo || p.TIPO_INSTALACAO || p.tipo_instalacao || 'Terminal';
        const mun = p.municipio || p.MUNICIPIO || p.cidade || '-';
        const uf = p.uf || p.UF || '-';
        const carga = p.perfil_carga || p.PERFIL_CARGA || 'Diversos';

        layer.bindPopup(`
          <div class="popup-header"><span>${nome}</span></div>
          <div class="popup-body">
            <div class="popup-linha"><span class="popup-rotulo">Tipo:</span><span class="popup-valor">${tipo}</span></div>
            <div class="popup-linha"><span class="popup-rotulo">Local:</span><span class="popup-valor">${mun} / ${uf}</span></div>
            <div class="popup-linha"><span class="popup-rotulo">Carga:</span><span class="popup-valor">${carga}</span></div>
          </div>
          <div class="popup-footer"><span>Regulação: <b>ANTAQ</b></span><span>Status: <b>Ativo</b></span></div>
        `);
      }
    });

    // --- Vias Economicamente Navegadas ---
    CamadaManager.carregarComFallback('vias', [
      'dados/vias_economicamente_navegadas.geojson',
      'dados/Vias_Economicamente_Navegadas.geojson'
    ], {
      nomeLegenda: "Vias Navegadas",
      style: { color: '#00e5ff', weight: 2.5, opacity: 0.85 },
      onEachFeature: (f, layer) => {
        const p = f.properties || {};
        const rio = p.rio || p.NOME_RIO || p.nome || 'Trecho Hidroviário';
        layer.bindTooltip(`Rio: ${rio}`, { sticky: true });
      }
    });

    // --- Linhas de Travessias ---
    CamadaManager.carregarComFallback('travessias', [
      'dados/linhas_travessias.geojson',
      'dados/Linhas_Travessias.geojson'
    ], {
      nomeLegenda: "Linhas de Travessias",
      style: { color: '#f59e0b', weight: 2, dashArray: '5, 5', opacity: 0.9 }
    });

    // --- Poligonais (TIS) ---
    CamadaManager.carregarComFallback('tis', [
      'dados/tis_poligonais.geojson',
      'dados/tis_poligonais_shp.geojson'
    ], {
      nomeLegenda: "Poligonais Portuárias / TIS",
      style: { color: '#ef4444', weight: 1.5, fillColor: '#ef4444', fillOpacity: 0.25 }
    });
  </script>
</body>
</html>
