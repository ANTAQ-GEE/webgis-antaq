name: Atualização de Camadas WebGIS ANTAQ

on:
  schedule:
    # Executa toda segunda-feira às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permite disparar a execução manual com um clique no GitHub

permissions:
  contents: write # Permissão obrigatória para salvar as camadas no repositório

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Pacotes Necessários
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Atualização
        run: |
          python pipeline_atualizacao.py

      - name: Salvar e Commitar Alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          
          if git diff-index --quiet HEAD --; then
            echo "Nenhuma mudança nas camadas. Nada a commitar."
          else
            git commit -m "Auto: Camadas geoespaciais atualizadas via API [skip ci]"
            git push
          fi