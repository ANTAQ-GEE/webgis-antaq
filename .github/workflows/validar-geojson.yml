name: Validação de GeoJSON

on:
  push:
    branches: [main]
    paths:
      - 'dados/**'
      - 'manifest.json'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar sintaxe de todos os GeoJSON
        run: |
          python - <<'EOF'
          import json, glob, sys, os
          erros = 0
          for f in glob.glob('dados/*.geojson'):
              try:
                  with open(f, encoding='utf-8') as fh:
                      j = json.load(fh)
                  n = len(j.get('features', []))
                  print(f'✓ {os.path.basename(f)}: {n} feições')
              except Exception as e:
                  print(f'✗ {f}: {e}')
                  erros += 1
          if erros:
              sys.exit(1)
          EOF

      - name: Validar manifest.json
        run: |
          python -c "
          import json
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert 'camadas' in m
          print(f'✓ Manifesto válido: {len(m[\"camadas\"])} camadas')
          "
