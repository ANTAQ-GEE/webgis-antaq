<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Desacoplado | ANTAQ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Biblioteca para leitura de Shapefile (.zip) e KML no navegador -->
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html, #mapa {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background-color: #0b132b;
    }

    /* -------------------------------------------------------------
       BARRA SUPERIOR (HEADER INSTITUCIONAL)
       ------------------------------------------------------------- */
    .top-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50px;
      background: #0a2540;
      border-bottom: 2px solid #005a9c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      color: #fff;
    }
    .top-header .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .top-header .actions { display: flex; align-items: center; gap: 10px; }
    .badge-homologacao {
      background: #f59e0b;
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .btn-atualizar {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-atualizar:hover { background: #0369a1; }

    /* -------------------------------------------------------------
       PAINEL LATERAL DE CAMADAS (DESACOPLADO)
       ------------------------------------------------------------- */
    .painel-camadas {
      position: absolute;
      top: 62px;
      right: 16px;
      width: 320px;
      max-height: calc(100% - 80px);
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 1000;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .painel-header {
      background: #0a2540;
      color: #fff;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .painel-header span.sub { font-size: 10px; color: #38bdf8; font-weight: 400; }
    
    .secao-categoria {
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 12px;
    }
    .secao-titulo {
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* Itens de Camada e Switch Liga/Desliga */
    .camada-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 11px;
      color: #334155;
    }
    .camada-info {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 230px;
    }
    .camada-qtd {
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
    }

    /* Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(14px); }

    /* Botão Adicionar Camada Temporária */
    .btn-add-layer {
      margin: 10px 12px 14px 12px;
      padding: 10px;
      border: 2px dashed #94a3b8;
      border-radius: 6px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add-layer:hover {
      background: #f1f5f9;
      border-color: #0284c7;
      color: #0284c7;
    }
    .btn-add-layer span { font-size: 9px; color: #64748b; display: block; font-weight: 400; }

    /* Rótulos e Popups */
    .rotulo-uf {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      letter-spacing: 1.5px !important;
      text-transform: uppercase !important;
      pointer-events: none !important;
      text-shadow: -1px -1px 2px #020617, 1px -1px 2px #020617, -1px 1px 2px #020617, 1px 1px 2px #020617;
    }
    .leaflet-popup-content-wrapper { border-radius: 8px; overflow: hidden; padding: 0; }
    .leaflet-popup-content { margin: 0 !important; min-width: 250px; }
    .pop-header { background: #0a2540; color: #fff; padding: 8px 12px; font-weight: 700; font-size: 12px; border-bottom: 2px solid #38bdf8; }
    .pop-body { padding: 10px 12px; font-size: 11px; color: #334155; }
    .pop-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #f1f5f9; }
    .pop-lbl { font-weight: 600; color: #64748b; }
    .pop-val { font-weight: 600; color: #0f172a; }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand">AGÊNCIA NACIONAL DE TRANSPORTES AQUAVIÁRIOS &mdash; ANTAQ</div>
    <div class="actions">
      <div class="badge-homologacao">Ambiente de Homologação</div>
      <button class="btn-atualizar" onclick="recarregarTodasCamadas()">🔄 Atualizar</button>
    </div>
  </header>

  <!-- PAINEL DE CAMADAS LATERAL -->
  <aside class="painel-camadas">
    <div class="painel-header">
      <span>PAINEL DE CAMADAS</span>
      <span class="sub">WebGIS Desacoplado</span>
    </div>

    <!-- MAPAS DE BASE -->
    <div class="secao-categoria">
      <div class="secao-titulo">Mapas de Base</div>
      <label class="camada-item">
        <span class="camada-info">Imagem de Satélite</span>
        <input type="radio" name="basemap" value="satelite" checked onchange="alternarBasemap(this.value)">
      </label>
      <label class="camada-item">
        <span class="camada-info">Mapa Técnico Escuro (Esri)</span>
        <input type="radio" name="basemap" value="escuro" onchange="alternarBasemap(this.value)">
      </label>
    </div>

    <!-- ÁREAS DINÂMICAS GERADAS PELO MANIFESTO -->
    <div id="categorias-container"></div>

    <!-- ANÁLISE TEMPORÁRIA (ADICIONAR CAMADA) -->
    <div class="secao-categoria">
      <div class="secao-titulo">Análise Temporária</div>
      <div class="btn-add-layer" onclick="document.getElementById('file-input').click()">
        + Adicionar Camada
        <span>Shapefile (.ZIP), GeoJSON ou KML</span>
      </div>
      <input type="file" id="file-input" style="display: none;" accept=".geojson,.json,.zip,.kml" onchange="processarArquivoLocal(this)">
    </div>
  </aside>

  <div id="mapa"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ========================================================
    // 1. INICIALIZAÇÃO DO MAPA
    // ========================================================
    const mapa = L.map('mapa', {
      center: [-13.5, -51.5],
      zoom: 4,
      zoomControl: false
    });
    L.control.zoom({ position: 'bottomleft' }).addTo(mapa);

    // ========================================================
    // 2. BASEMAPS LIVRES DE CHAVE E COM RÓTULOS NÍTIDOS
    // ========================================================
    const sateliteEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Satellite', maxZoom: 18
    }).addTo(mapa);

    const rotulosReferencia = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Labels', pane: 'overlayPane'
    }).addTo(mapa);

    const mapaEscuroEsri = L.layerGroup([
      L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'),
      L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}')
    ]);

    function alternarBasemap(tipo) {
      if (tipo === 'satelite') {
        mapa.removeLayer(mapaEscuroEsri);
        sateliteEsri.addTo(mapa);
        rotulosReferencia.addTo(mapa);
      } else {
        mapa.removeLayer(sateliteEsri);
        mapa.removeLayer(rotulosReferencia);
        mapaEscuroEsri.addTo(mapa);
      }
    }

    // ========================================================
    // 3. ESTILIZAÇÃO PADRONIZADA POR TIPO E FILTRO POR APROXIMAÇÃO
    // ========================================================
    const INSTANCIA_CAMADAS = {};

    function obterOpcoesPadronizadas(id) {
      return {
        pointToLayer: (f, latlng) => {
          if (id === 'instalacoes_portuarias') {
            const ehTup = (f.properties.tipo || '').toUpperCase().includes('TUP');
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: ehTup ? '#10b981' : '#0284c7', // Verde para TUP, Azul para Porto Público
              color: '#ffffff',
              weight: 1.5,
              fillOpacity: 0.9
            });
          }
          return L.circleMarker(latlng, { radius: 4, fillColor: '#38bdf8', color: '#0369a1', weight: 1, fillOpacity: 0.8 });
        },
        style: (f) => {
          if (id === 'vias_navegadas') return { color: '#00e5ff', weight: 2.5, opacity: 0.85 };
          if (id === 'linhas_travessias') return { color: '#f59e0b', weight: 2, dashArray: '5,5', opacity: 0.9 };
          if (id === 'tis_poligonais') return { color: '#ef4444', weight: 1.5, fillColor: '#ef4444', fillOpacity: 0.25 };
          if (id === 'uf') return { color: '#60a5fa', weight: 1.2, fillOpacity: 0 };
          return { color: '#94a3b8', weight: 1.5 };
        },
        onEachFeature: (f, layer) => {
          const p = f.properties || {};
          
          // Popups Padronizados
          if (id === 'instalacoes_portuarias') {
            const nome = p.nome || p.NOME_INSTALACAO || 'Terminal Portuário';
            const tipo = p.tipo || p.TIPO_INSTALACAO || 'Porto / TUP';
            const mun = p.municipio || p.MUNICIPIO || '-';
            const uf = p.uf || p.UF || '-';
            layer.bindPopup(`
              <div class="pop-header"><span>${nome}</span></div>
              <div class="pop-body">
                <div class="pop-row"><span class="pop-lbl">Tipo:</span><span class="pop-val">${tipo}</span></div>
                <div class="pop-row"><span class="pop-lbl">Local:</span><span class="pop-val">${mun}/${uf}</span></div>
                <div class="pop-row"><span class="pop-lbl">Regulação:</span><span class="pop-val">ANTAQ</span></div>
              </div>
            `);
          }

          // Rótulos inteligentes com controle de escala
          if (id === 'uf') {
            const sigla = p.SIGLA_UF || p.sigla || p.UF || p.nome;
            if (sigla) layer.bindTooltip(sigla, { permanent: true, direction: 'center', className: 'rotulo-uf' });
          }
        }
      };
    }

    // ========================================================
    // 4. CARREGAMENTO DESACOPLADO PELO MANIFESTO
    // ========================================================
    function carregarDoManifesto() {
      const ts = new Date().getTime();
      fetch(`dados/manifesto_camadas.json?_t=${ts}`)
        .then(res => res.json())
        .then(manifesto => {
          const container = document.getElementById('categorias-container');
          container.innerHTML = ''; // Limpa painel para reconstrução sem duplicatas

          // Agrupa camadas por categoria
          const grupos = {};
          (manifesto.camadas || []).forEach(c => {
            if (!grupos[c.categoria]) grupos[c.categoria] = [];
            grupos[c.categoria].push(c);
          });

          // Monta o DOM das categorias
          for (const [categoria, camadas] of Object.entries(grupos)) {
            const secao = document.createElement('div');
            secao.className = 'secao-categoria';
            secao.innerHTML = `<div class="secao-titulo">${categoria}</div>`;

            camadas.forEach(cfg => {
              const item = document.createElement('div');
              item.className = 'camada-item';
              item.innerHTML = `
                <div class="camada-info">
                  <span>${cfg.nome}</span>
                  <span class="camada-qtd" id="qtd-${cfg.id}"></span>
                </div>
                <label class="switch">
                  <input type="checkbox" id="chk-${cfg.id}" onchange="toggleCamada('${cfg.id}', this.checked)">
                  <span class="slider"></span>
                </label>
              `;
              secao.appendChild(item);

              // Carrega a camada GeoJSON
              fetch(`${cfg.arquivo}?_t=${ts}`)
                .then(r => r.json())
                .then(geojsonData => {
                  const opcoes = obterOpcoesPadronizadas(cfg.id);
                  
                  // Se já existe, apenas limpa e substitui
                  if (INSTANCIA_CAMADAS[cfg.id]) {
                    INSTANCIA_CAMADAS[cfg.id].clearLayers();
                    INSTANCIA_CAMADAS[cfg.id].addData(geojsonData);
                  } else {
                    INSTANCIA_CAMADAS[cfg.id] = L.geoJSON(geojsonData, opcoes);
                  }

                  // Atualiza a contagem de feições: ex: (59)
                  const count = geojsonData.features ? geojsonData.features.length : 0;
                  const elQtd = document.getElementById(`qtd-${cfg.id}`);
                  if (elQtd) elQtd.innerText = `(${count})`;

                  // Ativação inicial
                  const chk = document.getElementById(`chk-${cfg.id}`);
                  if (cfg.ativa !== false) {
                    if (chk) chk.checked = true;
                    INSTANCIA_CAMADAS[cfg.id].addTo(mapa);
                  }
                })
                .catch(e => console.warn(`Falha ao carregar ${cfg.arquivo}:`, e));
            });

            container.appendChild(secao);
          }
        });
    }

    function toggleCamada(id, ativa) {
      if (!INSTANCIA_CAMADAS[id]) return;
      if (ativa) {
        INSTANCIA_CAMADAS[id].addTo(mapa);
      } else {
        mapa.removeLayer(INSTANCIA_CAMADAS[id]);
      }
    }

    function recarregarTodasCamadas() {
      carregarDoManifesto();
    }

    // ========================================================
    // 5. FILTRO POR APROXIMAÇÃO (SCALE / ZOOM DEPENDENCY)
    // ========================================================
    mapa.on('zoomend', function() {
      const z = mapa.getZoom();
      const camadaUf = INSTANCIA_CAMADAS['uf'];
      // Em zoom detalhado (>=9), desliga rótulos de UF para não poluir
      if (camadaUf && mapa.hasLayer(camadaUf)) {
        if (z >= 9) {
          mapa.removeLayer(camadaUf);
        } else {
          mapa.addLayer(camadaUf);
        }
      }
    });

    // ========================================================
    // 6. ADICIONAR CAMADAS LOCAIS (SHAPEFILE .ZIP, GEOJSON, KML)
    // ========================================================
    function processarArquivoLocal(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();

      if (file.name.toLowerCase().endsWith('.zip')) {
        reader.onload = function(e) {
          shp(e.target.result).then(function(geojson) {
            adicionarCamadaAoMapa(file.name, geojson);
          });
        };
        reader.readAsArrayBuffer(file);
      } else if (file.name.toLowerCase().endsWith('.geojson') || file.name.toLowerCase().endsWith('.json')) {
        reader.onload = function(e) {
          const geojson = JSON.parse(e.target.result);
          adicionarCamadaAoMapa(file.name, geojson);
        };
        reader.readAsText(file);
      }
    }

    function adicionarCamadaAoMapa(nome, geojsonData) {
      const camadaTemp = L.geoJSON(geojsonData, {
        style: { color: '#ec4899', weight: 2, fillOpacity: 0.3 },
        onEachFeature: (f, l) => {
          let html = '<div class="pop-header"><span>Feição Temporária</span></div><div class="pop-body">';
          for (let k in f.properties) {
            html += `<div class="pop-row"><span class="pop-lbl">${k}:</span><span class="pop-val">${f.properties[k]}</span></div>`;
          }
          html += '</div>';
          l.bindPopup(html);
        }
      }).addTo(mapa);

      mapa.fitBounds(camadaTemp.getBounds());
      alert(`Camada temporária carregada: ${nome} (${geojsonData.features.length} feições)`);
    }

    // Inicialização
    carregarDoManifesto();
  </script>
</body>
</html>
