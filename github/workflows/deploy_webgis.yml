name: Pipeline CI/CD Cartográfico WebGIS ANTAQ

on:
  push:
    branches:
      - main
      - homologacao
    paths:
      - 'dados/**'
      - 'scripts/**'
      - '*.html'
      - 'manifest*.json'
  pull_request:
    branches:
      - main
      - homologacao
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    name: Validação e Governança Cartográfica
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Geoespaciais
        run: |
          python -m pip install --upgrade pip
          pip install shapely geopandas pyproj

      - name: Executar Pipeline de Dados e Geração de Manifesto
        run: |
          python scripts/pipeline_geo.py

      - name: Validar Sintaxe JSON e HTML
        run: |
          python3 -c "
          import json
          with open('dados/manifest.json', 'r', encoding='utf-8') as f:
              m = json.load(f)
              assert 'camadas' in m, 'Manifesto inválido'
              print(f'✓ Validação JSON concluída com sucesso: {len(m[\"camadas\"])} camadas.')
          "

      - name: Atualizar Repositório com Novo Manifesto (Se houver alterações)
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "ANTAQ-GeoBot"
          git add dados/manifest.json manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cartografia): atualização automática do manifesto de camadas [skip ci]" && git push)

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao'
        uses: actions/configure-pages@v4

      - name: Upload de Artefato para Publicação
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    name: Publicação Contínua no WebGIS
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

